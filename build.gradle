plugins { id 'java' }

group = 'dev.tempoross'
version = '0.1.0'

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex 'net\\.runelite.*' }
    }
    mavenCentral()
}

def clientVersion = '1.13.8'
dependencies {
    compileOnly "net.runelite:client:${clientVersion}"
    testImplementation "net.runelite:client:${clientVersion}"
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly "net.runelite:jshell:${clientVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}
tasks.named('jar') { from('runelite-plugin.properties') }
tasks.register('devJar', Jar) {
    dependsOn testClasses
    from(sourceSets.test.output) { include 'dev/tempoross/assist/DevelopmentClient.class' }
    archiveFileName = 'brainless-16-19-19-dev.jar'
}
tasks.named('assemble') { dependsOn 'devJar' }
tasks.register('verifyAssist', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.tempoross.assist.AssistChecks'
    jvmArgs '-ea', '-Djava.awt.headless=true'
    systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile.absolutePath
}
tasks.named('test') { dependsOn verifyAssist }
tasks.register('run', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.tempoross.assist.DevelopmentClient'
    jvmArgs '-ea'
    args '--developer-mode'
}
